<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>영화 기록 | 관리</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="container">
      <a class="back-link" href="index.html">← 시작 화면</a>
      <h1>영화 관리</h1>
      <p>영화 정보는 MockAPI 서버에 저장됩니다.</p>

      <section class="panel" aria-labelledby="form-title">
        <h2 id="form-title">영화 추가</h2>
        <form id="movie-form" novalidate>
          <input id="movie-id" name="id" type="hidden">

          <div class="fields">
            <label for="title">제목
              <input id="title" name="title" type="text" maxlength="80" required>
            </label>
            <label for="director">감독
              <input id="director" name="director" type="text" maxlength="50" required>
            </label>
            <label for="distributor">배급사
              <input id="distributor" name="distributor" type="text" maxlength="50" required>
            </label>
            <label for="released-date">개봉일
              <input id="released-date" name="releasedDate" type="date" required>
            </label>
          </div>

          <p id="form-error" class="error" role="alert" hidden></p>
          <div class="actions">
            <button id="submit-button" type="submit">추가</button>
            <button id="cancel-button" type="button" hidden>수정 취소</button>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="list-title">
        <div class="list-header">
          <h2 id="list-title">영화 목록</h2>
          <label for="search">검색
            <input id="search" type="search" placeholder="제목·감독·배급사">
          </label>
        </div>

        <p id="status" role="status" aria-live="polite">목록을 불러오는 중...</p>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th scope="col">제목</th>
                <th scope="col">감독</th>
                <th scope="col">배급사</th>
                <th scope="col">개봉일</th>
                <th scope="col">관리</th>
              </tr>
            </thead>
            <tbody id="movie-list"></tbody>
          </table>
        </div>
      </section>
    </main>
  </body>
</html>
